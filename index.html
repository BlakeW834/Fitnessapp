<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Train & Eat</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0a;--surface:#111113;--surface2:#1a1a1e;--surface3:#222228;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#ede9df;--muted:#6b6b65;--muted2:#4a4a45;
  --accent:#d4f53c;--accent2:#f5a623;--red:#ff5252;--blue:#52b8ff;--teal:#3cffd4;--green:#52ff8a;
}
html,body{min-height:100%;overflow-x:hidden;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
.header{padding:1.2rem 1rem 0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:0.04em;line-height:1;}
.logo em{color:var(--accent);font-style:normal;}
.week-controls{display:flex;align-items:center;gap:6px;}
.wk-btn{padding:5px 12px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.7rem;border-radius:6px;cursor:pointer;min-height:32px;}
.wk-num{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--accent);min-width:55px;text-align:center;}
.phase-banner{margin:10px 1rem 0;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;}
.phase-banner.p1{background:rgba(212,245,60,0.08);border:1px solid rgba(212,245,60,0.2);}
.phase-banner.p2{background:rgba(82,184,255,0.06);border:1px solid rgba(82,184,255,0.15);}
.ph-name{font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;}
.ph-name.p1{color:var(--accent);}
.ph-name.p2{color:var(--blue);}
.ph-cal{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;}
.ph-cal.p1{color:var(--accent);}
.ph-cal.p2{color:var(--blue);}
.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px 1rem 0;}
.mode-tab{padding:9px 4px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.68rem;cursor:pointer;text-align:center;text-transform:uppercase;letter-spacing:0.04em;transition:all 0.15s;min-height:40px;}
.mode-tab.on{background:var(--accent);color:#0a0a0a;border-color:var(--accent);font-weight:500;}
.day-pills{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:10px 1rem 0;}
.day-pills::-webkit-scrollbar{display:none;}
.day-pill{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.7rem;cursor:pointer;text-transform:uppercase;transition:all 0.15s;position:relative;min-height:32px;}
.day-pill.on{background:var(--accent);color:#0a0a0a;border-color:var(--accent);}
.day-pill.done:not(.on){border-color:rgba(212,245,60,0.4);color:var(--accent);}
.day-pill .dot{position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--accent2);}
.week-dots{display:flex;gap:4px;padding:8px 1rem 0;}
.wdot{flex:1;height:4px;border-radius:2px;background:var(--surface3);}
.wdot.dn{background:var(--accent);}
.wdot.td{background:var(--accent2);}
.main{padding:10px 1rem 80px;}
.view{display:none;}.view.on{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.card-h{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-h-l{display:flex;align-items:center;gap:8px;}
.tbar{width:3px;height:22px;border-radius:2px;flex-shrink:0;}
.ct{font-size:14px;font-weight:500;color:var(--text);}
.cs{font-size:11px;color:var(--muted);}
.done-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:32px;}
.done-btn.on{background:rgba(212,245,60,0.12);color:var(--accent);border-color:rgba(212,245,60,0.3);}
.et{width:100%;border-collapse:collapse;}
.et th{font-size:10px;color:var(--muted);padding:6px 14px;text-align:left;border-bottom:1px solid var(--border);font-weight:400;text-transform:uppercase;letter-spacing:0.06em;}
.et td{padding:8px 14px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
.et tr:last-child td{border-bottom:none;}
.bge{font-size:10px;padding:2px 7px;border-radius:4px;display:inline-block;}
.bg{background:rgba(212,245,60,0.12);color:var(--accent);}
.bb{background:rgba(82,184,255,0.12);color:var(--blue);}
.ba{background:rgba(245,166,35,0.12);color:var(--accent2);}
.br{background:rgba(255,82,82,0.1);color:var(--red);}
.bt{background:rgba(60,255,212,0.08);color:var(--teal);}
.pb{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(245,166,35,0.12);color:var(--accent2);margin-left:4px;}
.oi{background:rgba(245,166,35,0.06);border:1px solid rgba(245,166,35,0.15);border-radius:6px;padding:8px 14px;margin:8px 14px;font-size:12px;color:var(--accent2);font-style:italic;}
.ii{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:12px;outline:none;padding:2px 0;width:100%;font-family:'DM Mono',monospace;}
.notes-wrap{padding:10px 14px;border-top:1px solid var(--border);}
.notes-lbl{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.notes-ta{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;resize:none;outline:none;min-height:44px;line-height:1.5;}
.notes-ta::placeholder{color:var(--muted2);}
.int-row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border);}
.int-row:last-child{border-bottom:none;}
.int-n{font-size:10px;color:var(--muted2);width:18px;font-family:'DM Mono',monospace;}
.int-nm{font-size:13px;font-weight:500;flex:1;}
.int-d{font-size:11px;color:var(--muted);}
.mk-num{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:var(--accent);line-height:1;}
.stretch-intro{padding:10px 14px;font-size:12px;color:var(--muted);font-style:italic;border-bottom:1px solid var(--border);line-height:1.6;}
.stretch-item{padding:12px 14px;border-bottom:1px solid var(--border);}
.stretch-item:last-child{border-bottom:none;}
.stretch-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted2);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.06em;}
.stretch-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px;}
.stretch-dur{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(60,255,212,0.08);color:var(--teal);margin-bottom:6px;}
.stretch-how{font-size:12px;color:var(--muted);line-height:1.6;}
.stretch-target{font-size:10px;color:var(--accent2);margin-top:4px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;}
.macro-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.macro-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;font-family:'DM Mono',monospace;}
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.macro-item{text-align:center;background:var(--surface2);border-radius:8px;padding:10px 8px;}
.macro-val{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.03em;line-height:1;}
.macro-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.05em;}
.macro-bar{height:3px;border-radius:2px;background:var(--surface3);margin-top:5px;overflow:hidden;}
.macro-fill{height:100%;border-radius:2px;}
.macro-goal{font-size:10px;color:var(--muted2);margin-top:2px;}
.tip{padding:8px 12px;background:rgba(212,245,60,0.05);border-top:1px solid var(--border);font-size:11px;color:var(--muted);font-style:italic;line-height:1.5;}
.meal-row{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px;}
.meal-row:last-child{border-bottom:none;}
.mi-name{font-size:13px;font-weight:500;color:var(--text);}
.mi-desc{font-size:11px;color:var(--muted);margin-top:1px;}
.mi-mac{font-size:10px;color:var(--muted2);margin-top:3px;font-family:'DM Mono',monospace;}
.auto-tag{font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(82,184,255,0.1);color:var(--blue);margin-left:4px;vertical-align:middle;}
.water-row{display:flex;align-items:center;gap:6px;padding:10px 14px;flex-wrap:wrap;}
.water-lbl{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
.glass{width:20px;height:24px;border-radius:3px;border:1px solid var(--border2);background:transparent;cursor:pointer;min-height:24px;}
.glass.on{background:rgba(82,184,255,0.25);border-color:var(--blue);}
.water-ct{font-size:11px;color:var(--blue);font-family:'DM Mono',monospace;}
.shop-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.shop-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.04em;}
.shop-prog{font-size:12px;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace;}
.shop-prog span{color:var(--accent);}
.shop-pb{height:4px;border-radius:2px;background:var(--surface3);margin-bottom:12px;overflow:hidden;}
.shop-pf{height:100%;border-radius:2px;background:var(--accent);transition:width 0.3s;}
.shop-cat-h{padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.shop-cat-n{font-size:12px;font-weight:500;color:var(--text);}
.shop-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;min-height:44px;}
.shop-item:last-child{border-bottom:none;}
.shop-ck{width:18px;height:18px;border-radius:4px;border:1px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.shop-ck.on{background:var(--accent);border-color:var(--accent);color:#0a0a0a;font-weight:700;}
.shop-n{font-size:13px;font-weight:500;color:var(--text);}
.shop-q{font-size:11px;color:var(--blue);font-family:'DM Mono',monospace;}
.shop-nt{font-size:11px;color:var(--muted);}
.add-row{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--border);}
.add-inp{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;outline:none;}
.add-btn{padding:7px 14px;border-radius:6px;border:1px solid rgba(212,245,60,0.3);background:rgba(212,245,60,0.08);color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;white-space:nowrap;min-height:32px;}
.sm-btn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;min-height:32px;}
</style>
</head>

// Dinner targets per day per phase
// Phase 1 (2600):
// Mon double smoothie: 2600-115-500-750-185-60 = 990
// Tue double muffins: 2600-115-800-700-185-60 = 740
// Wed double smoothie legs: 2600-115-500-750-185-60 = 990
// Thu single: 2600-115-600-900-60 = 925
// Fri double smoothie: 2600-115-500-750-185-60 = 990
// Sat double muffins: 2600-115-800-700-185-60 = 740
// Sun single: 2600-115-500-1000-60 = 925
const DN_P1=[990,740,990,925,990,740,925];

// Phase 2 (2400):
// Mon double smoothie: 2400-115-450-680-185-60 = 910
// Tue double muffins: 2400-115-720-640-185-60 = 680
// Wed double smoothie legs: 2400-115-450-680-185-60 = 910
// Thu single: 2400-115-500-800-60 = 925
// Fri double smoothie: 2400-115-450-680-185-60 = 910
// Sat double muffins: 2400-115-720-640-185-60 = 680
// Sun single: 2400-115-450-850-60 = 925
const DN_P2=[910,680,910,925,910,680,925];

function getDinner(di,phase){
  const carb=DCARBS[di];
  const targets=phase===1?DN_P1:DN_P2;
  const target=targets[di];
  const carbCal=carb.ck;
  // steak + greens(48) + butter(36) + spray(5) = target
  const steakCal=target-carbCal-48-36-5;
  const steakG=Math.round(steakCal/1.48);
  const steakP=Math.round(steakG*0.20);
  const steakF=Math.round(steakG*0.072);
  const carbC=parseInt((carb.m.match(/(\d+)C/)||[0,50])[1]);
  const carbP=parseInt((carb.m.match(/(\d+)P/)||[0,3])[1]);
  const carbLabel=carb.n.split(' ').slice(0,2).join(' ');
  return{
    nm:`Dinner — Skirt Steak + ${carbLabel}`,ic:'🥩',
    cal:target,p:steakP+carbP+4,c:carbC+8,f:steakF+1+4,
    items:[
      {n:`Skirt steak ${steakG}g`,d:'Hot pan + cooking spray, 2–3 min each side, rest 5 min',m:`${steakP}P·0C·${steakF}F·${steakCal}cal`},
      carb,
      {n:'Steamed greens 150g',d:'Broccoli, beans or broccolini — no oil needed',m:'4P·8C·0F·48cal'},
      {n:'Butter 5g on steak',d:'While steak rests',m:'0P·0C·4F·36cal'},
      {n:'Cooking spray',d:'For steak pan — saves ~100 kcal vs oil',m:'0P·0C·0F·5cal'},
    ]
  };
}

function getMeals(di){

  const isDouble=[true,true,true,false,true,true,false][di];
  const bfsP1=[P1_BSM,P1_BMF,P1_BSM,P1_BSM_C,P1_BSM,P1_BMF,P1_BSM_R];
  const bfsP2=[P2_BSM,P2_BMF,P2_BSM,P2_BSM_C,P2_BSM,P2_BMF,P2_BSM_R];
  const lunP1=[P1_LCK,P1_LMN,P1_LWD,P1_LTH,P1_LCK,P1_LMN,P1_LSN];
  const lunP2=[P2_LCK,P2_LMN,P2_LWD,P2_LTH,P2_LCK,P2_LMN,P2_LSN];
  const bfs=phase===1?bfsP1:bfsP2;
  const lun=phase===1?lunP1:lunP2;
  const ms=[PRE,bfs[di],lun[di]];
  if(isDouble) ms.push(SNACK);
  ms.push(getDinner(di,phase));
  ms.push(DESSERT);
  ms.push(DRINKS);
  return ms;
}

  let inner='';
  if(s.kd==='prog'){
    inner=`<table class="et"><tr><th>Exercise</th><th>Sets×Reps</th><th>Weight</th></tr>${[1,2,3,4,5,6,7,8].map(n=>`<tr><td>${inp('Exercise '+n)}</td><td>${inp('—','70px')}</td><td>${inp('kg','55px')}</td></tr>`).join('')}</table>`;
  }else if(s.kd==='bike'){
    inner=`<table class="et"><tr><th>Activity</th><th>Target</th></tr><tr><td>20km Ride</td><td><span class="bge bb">Zone 2 pace</span></td></tr></table>`;
  }else if(s.kd==='cls'){
    inner=`<div style="padding:10px 14px;font-size:13px;color:var(--muted);font-style:italic">Coach-led session — use notes to log weights and how you felt.</div>`;
  }else if(s.kd==='bstr'){
    inner=`<table class="et"><tr><th>Activity</th><th>Duration</th></tr><tr><td>Bike</td><td><span class="bge bb">30 min easy</span></td></tr><tr><td>Stretch class</td><td><span class="bge bt">Class</span></td></tr></table>`;
  }else if(s.kd==='legs'){
    const w=s.w;
    inner=`${wk>1?`<div class="oi">📈 Week ${wk} progressive overload — weights increased. Keep pushing.</div>`:''}
    <table class="et"><tr><th>Exercise</th><th>Sets×Reps</th><th>Target</th><th>Actual</th></tr>
    <tr><td>Squat</td><td style="color:var(--muted);font-size:12px">5×5</td><td><span class="bge bg">${w.sq}kg<span class="pb">+2.5/wk</span></span></td><td>${inp('kg','55px')}</td></tr>
    <tr><td>Trap Bar DL</td><td style="color:var(--muted);font-size:12px">5×8</td><td><span class="bge bg">${w.tr}kg<span class="pb">+2.5/wk</span></span></td><td>${inp('kg','55px')}</td></tr>
    <tr><td>DB Lunge</td><td style="color:var(--muted);font-size:12px">4×10 each</td><td><span class="bge bg">${w.lu}kg<span class="pb">+1/wk</span></span></td><td>${inp('kg','55px')}</td></tr>
    <tr><td>Romanian DL</td><td style="color:var(--muted);font-size:12px">4×10</td><td><span class="bge bg">${w.rd}kg<span class="pb">+2.5/wk</span></span></td><td>${inp('kg','55px')}</td></tr>
    <tr><td>Hip Thrusts</td><td style="color:var(--muted);font-size:12px">4×10</td><td><span class="bge bg">${w.hi}kg<span class="pb">+2.5/wk</span></span></td><td>${inp('kg','55px')}</td></tr>
    <tr><td>Weighted Sit-up</td><td style="color:var(--muted);font-size:12px">4×15</td><td>—</td><td>${inp('kg','55px')}</td></tr>
    <tr><td>Russian Twists</td><td style="color:var(--muted);font-size:12px">4×20</td><td>—</td><td>${inp('kg','55px')}</td></tr></table>`;
  }else if(s.kd==='c2b'){
    inner=`<div class="int-row"><span class="int-n">WU</span><span class="int-nm">Warm-up</span><span class="int-d">10 min easy spin</span><span class="bge bt">easy</span></div>
    <div class="int-row"><span class="int-n">1</span><span class="int-nm">Sprints</span><span class="int-d">10s all-out / 50s easy × 6 rounds</span><span class="bge br">max</span></div>
    <div class="int-row"><span class="int-n">2</span><span class="int-nm">Threshold</span><span class="int-d">3 min hard / 2 min easy × 4 rounds</span><span class="bge ba">hard</span></div>
    <div class="int-row"><span class="int-n">3</span><span class="int-nm">Pyramid</span><span class="int-d">30s/45s/60s/45s/30s — 15s rest</span><span class="bge ba">hard</span></div>
    <div class="int-row"><span class="int-n">CD</span><span class="int-nm">Cool-down</span><span class="int-d">5 min easy</span><span class="bge bt">easy</span></div>
    <div style="padding:8px 14px;font-size:11px;color:var(--muted);font-style:italic">Damper 5–7. Smooth stroke on recovery intervals.</div>`;
  }else if(s.kd==='wod'){
    inner=`<table class="et"><tr><th colspan="2" style="color:var(--accent2)">WOD — write it in this morning 💥</th></tr>${[1,2,3,4,5,6].map(n=>`<tr><td style="width:20px;color:var(--muted2);font-size:12px">${n}.</td><td>${inp('Movement / reps...')}</td></tr>`).join('')}</table>`;
  }else if(s.kd==='mk'){
    inner=`<div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface2)">
      <div class="mk-num">${s.mc}</div><div><div style="font-size:13px;font-weight:500">cals per machine this week</div><div style="font-size:11px;color:var(--muted)">Week ${wk} — +1 each week from 14</div></div></div>
    <table class="et"><tr><th>Machine</th><th>Target</th><th>Actual</th><th>Time</th></tr>
    ${[['Ski Erg','❄️'],['Row','🚣'],['Assault Bike','💨'],['Erg Bike (45s)','🚲']].map(([n,ic])=>`<tr><td>${ic} ${n}</td><td><span class="bge bb">${s.mc} cal</span></td><td>${inp('cal','50px')}</td><td>${inp('sec','50px')}</td></tr>`).join('')}</table>`;
  }else if(s.kd==='sWed'){
    inner=`<div style="padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;color:var(--teal)">${STR_WED.title}</span><span class="bge bt">${STR_WED.dur}</span></div>${rStretch(STR_WED)}`;
  }else if(s.kd==='sFri'){
    inner=`<div style="padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;color:var(--teal)">${STR_FRI.title}</span><span class="bge bt">${STR_FRI.dur}</span></div>${rStretch(STR_FRI)}`;
  }else if(s.kd==='sSun'){
    inner=`<div style="padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;color:var(--teal)">${STR_SUN.title}</span><span class="bge bt">${STR_SUN.dur}</span></div>${rStretch(STR_SUN)}<div style="padding:10px 14px;border-top:1px solid var(--border);background:rgba(180,82,255,0.06);font-size:12px;color:var(--muted)">🧖 <strong style="color:var(--text)">Sauna</strong> after stretching — recovery and relaxation. Stay hydrated.</div>`;
  }
  return`<div class="card"><div class="card-h"><div class="card-h-l"><div class="tbar" style="background:${tcol(s.tp)}"></div><div><div class="cs">${s.tm}</div><div class="ct">${s.nm}</div></div></div>
    <button class="done-btn ${isDn?'on':''}" onclick="tDone('${k}',this)">${isDn?'✓ Done':'Mark done'}</button></div>
    ${inner}<div class="notes-wrap"><div class="notes-lbl">Session notes</div>
    <textarea class="notes-ta" rows="2" placeholder="Notes, weights, how you felt..." onchange="nts['${k}']=this.value">${nt}</textarea></div></div>`;
}

// ---- RENDER ----
function rTrain(di){
  const wd=getWD(wk),d=wd[di];
  const two=d.ss.length===2;
  document.getElementById('tc').innerHTML=`
    <div style="margin-bottom:10px">
      <div style="font-size:22px;font-weight:500;color:var(--text)">${d.nm}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px;font-style:italic">${d.sub}</div>
      <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">${d.tags.map(([l,c])=>`<span class="bge ${c}" style="font-size:10px">${l}</span>`).join('')}</div>
    </div>
    <div style="display:grid;gap:10px${two?';grid-template-columns:repeat(2,minmax(0,1fr))':''}">${d.ss.map((s,si)=>rSess(s,di,si)).join('')}</div>`;
}

function rFood(di){
  const ph=getPhase(wk);
  const meals=getMeals(di);
  let tC=0,tP=0,tCa=0,tF=0;
  meals.forEach(m=>{tC+=m.cal;tP+=m.p;tCa+=m.c;tF+=m.f;});
  const pct=(v,g)=>Math.min(100,Math.round(v/g*100));
  const wkey=`w-${wk}-${di}`,wc=wat[wkey]||0;
  const mH=meals.map(m=>`<div class="card" style="margin-bottom:10px">
    <div class="card-h"><div>
      <div class="ct">${m.ic} ${m.nm}${m.auto?'<span class="auto-tag">auto</span>':''}</div>
      <div class="cs">${m.cal} kcal · ${m.p}g P · ${m.c}g C · ${m.f}g F</div>
    </div></div>
    ${m.items.map(it=>`<div class="meal-row"><div><div class="mi-name">${it.n}</div><div class="mi-desc">${it.d}</div><div class="mi-mac">${it.m}</div></div></div>`).join('')}
  </div>`).join('');
  document.getElementById('fc').innerHTML=`
    <div class="macro-wrap">
      <div class="macro-title">${DAYS[di]} · ${ph.name}</div>
      <div class="macro-grid">
        <div class="macro-item"><div class="macro-val" style="color:var(--accent)">${tC}</div><div class="macro-lbl">Calories</div><div class="macro-bar"><div class="macro-fill" style="width:${pct(tC,ph.cal)}%;background:var(--accent)"></div></div><div class="macro-goal">${tC} / ${ph.cal}</div></div>
        <div class="macro-item"><div class="macro-val" style="color:var(--green)">${tP}g</div><div class="macro-lbl">Protein</div><div class="macro-bar"><div class="macro-fill" style="width:${pct(tP,ph.p)}%;background:var(--green)"></div></div><div class="macro-goal">${tP} / ${ph.p}g</div></div>
        <div class="macro-item"><div class="macro-val" style="color:var(--blue)">${tCa}g</div><div class="macro-lbl">Carbs</div><div class="macro-bar"><div class="macro-fill" style="width:${pct(tCa,ph.c)}%;background:var(--blue)"></div></div><div class="macro-goal">${tCa} / ${ph.c}g</div></div>
        <div class="macro-item"><div class="macro-val" style="color:var(--accent2)">${tF}g</div><div class="macro-lbl">Fat</div><div class="macro-bar"><div class="macro-fill" style="width:${pct(tF,ph.f)}%;background:var(--accent2)"></div></div><div class="macro-goal">${tF} / ${ph.f}g</div></div>
      </div>
      <div class="tip">💡 ${NOTES[di]}</div>
    </div>
    <div style="font-size:11px;color:var(--muted2);margin-bottom:8px;font-family:'DM Mono',monospace">Items marked "auto" tracked every day automatically</div>
    ${mH}
    <div class="card"><div class="water-row"><span class="water-lbl">💧 Water</span>
      ${Array.from({length:10},(_,i)=>`<button class="glass ${i<wc?'on':''}" onclick="tWat(${i},${di})" title="${(i+1)*250}ml" aria-label="${i+1} glasses"></button>`).join('')}
      <span class="water-ct">${wc}/10 · ${wc*250}ml</span></div></div>`;
}

function rShop(){
  const all=SHOP.reduce((a,c)=>a.concat(c.items),[]).concat(cust);
  const dn=all.filter((_,i)=>shk[i]).length,tot=all.length;
  let gi=0;
  const h=SHOP.map(cat=>{
    const iH=cat.items.map(item=>{const idx=gi++,ck=shk[idx];return`<div class="shop-item" onclick="tShop(${idx})"><div class="shop-ck ${ck?'on':''}">${ck?'✓':''}</div><div style="${ck?'opacity:0.35;text-decoration:line-through':''}"><div class="shop-n">${item.n}</div><div class="shop-q">${item.q}</div><div class="shop-nt">${item.nt}</div></div></div>`;}).join('');
    return`<div class="card" style="margin-bottom:10px"><div class="shop-cat-h"><span class="shop-cat-n">${cat.cat}</span><span style="font-size:11px;color:var(--muted)">${cat.items.length}</span></div>${iH}<div class="add-row"><input class="add-inp" placeholder="Add item..." id="si-${SHOP.indexOf(cat)}"/><button class="add-btn" onclick="addShop(${SHOP.indexOf(cat)})">+ Add</button></div></div>`;
  }).join('');
  const cH=cust.length?`<div class="card" style="margin-bottom:10px"><div class="shop-cat-h"><span class="shop-cat-n">➕ My additions</span></div>${cust.map((it,i)=>{const idx=SHOP.reduce((a,c)=>a+c.items.length,0)+i,ck=shk[idx];return`<div class="shop-item" onclick="tShop(${idx})"><div class="shop-ck ${ck?'on':''}">${ck?'✓':''}</div><div style="${ck?'opacity:0.35;text-decoration:line-through':''}"><div class="shop-n">${it.n}</div></div></div>`;}).join('')}</div>`:'';
  document.getElementById('sc').innerHTML=`
    <div class="shop-hdr"><div class="shop-title">🛒 Shopping List</div><div style="display:flex;gap:6px"><button class="sm-btn" onclick="clrShop()">Clear</button><button class="sm-btn" onclick="tickAll()">Tick all</button></div></div>
    <div class="shop-prog"><span>${dn}</span> of ${tot} ticked</div>
    <div class="shop-pb"><div class="shop-pf" style="width:${tot?Math.round(dn/tot*100):0}%"></div></div>
    ${h}${cH}`;
}

function rPhase(){
  const ph=getPhase(wk);
  const desc=ph.cls==='p1'?'Fuelling muscle growth — calorie surplus':'Stepping down — losing fat, keeping muscle';
  document.getElementById('phase-banner').innerHTML=`<div class="phase-banner ${ph.cls}">
    <div><div class="ph-name ${ph.cls}">${ph.name}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${desc}</div></div>
    <div class="ph-cal ${ph.cls}">${ph.cal}<span style="font-size:0.75rem;font-family:'DM Mono',monospace;opacity:0.7"> kcal</span></div>
  </div>`;
}

function rWdots(){
  const td=(new Date().getDay()+6)%7;
  document.getElementById('week-dots').innerHTML=SH.map((d,i)=>{const dn=chkDn(i),isT=i===td;return`<div class="wdot${dn?' dn':isT?' td':''}" title="${d}"></div>`;}).join('');
}

function rDayPills(){
  document.getElementById('day-pills').innerHTML=DAYS.map((d,i)=>{
    const isA=i===curDay,isDn=chkDn(i),isTwo=getWD(wk)[i].ss.length>1;
    return`<button class="day-pill${isA?' on':''}${isDn&&!isA?' done':''}" onclick="selDay(${i})">${SH[i]}${isDn&&!isA?' ✓':''}${isTwo&&!isA?'<span class="dot"></span>':''}</button>`;
  }).join('');
}

function chkDn(di){return getWD(wk)[di].ss.every((_,si)=>done[`${wk}-${di}-${si}`]);}

// ---- ACTIONS ----
function tDone(k,btn){done[k]=!done[k];btn.textContent=done[k]?'✓ Done':'Mark done';btn.classList.toggle('on',done[k]);rDayPills();rWdots();}
function tWat(idx,di){const k=`w-${wk}-${di}`,c=wat[k]||0;wat[k]=idx<c?idx:idx+1;rFood(di);}
function tShop(idx){shk[idx]=!shk[idx];rShop();}
function clrShop(){shk={};rShop();}
function tickAll(){const t=SHOP.reduce((a,c)=>a+c.items.length,0)+cust.length;for(let i=0;i<t;i++)shk[i]=true;rShop();}
function addShop(ci){const i=document.getElementById(`si-${ci}`);const v=i.value.trim();if(!v)return;cust.push({n:v});i.value='';rShop();}
function setMode(m){mode=m;['train','food','shop'].forEach(x=>{document.getElementById(`mt-${x}`).classList.toggle('on',x===m);document.getElementById('v-'+x).classList.toggle('on',x===m);});if(m==='train')rTrain(curDay);else if(m==='food')rFood(curDay);else rShop();}
function selDay(i){curDay=i;rDayPills();if(mode==='train')rTrain(i);else if(mode==='food')rFood(i);}
function chWk(d){wk=Math.max(1,Math.min(12,wk+d));document.getElementById('wk-lbl').textContent='WK '+wk;rPhase();rDayPills();rWdots();if(mode==='train')rTrain(curDay);else if(mode==='food')rFood(curDay);}

// ---- INIT ----
rPhase();rDayPills();rWdots();rTrain(curDay);
</script>
</body>
</html>
